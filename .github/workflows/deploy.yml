name: Deploy Miam to GitHub Pages

on:
  push:
    # la branche par défaut du repo (seule autorisée par l'environnement Pages)
    branches: [main, claude/miam-meal-planner-qbhhsi]
  workflow_dispatch:

# Autorise le déploiement Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install
        run: npm ci

      # Récupère les recettes du monde (TheMealDB) — a besoin d'Internet, dispo ici.
      # Défensif : en cas d'échec le build continue avec les recettes FR seules.
      - name: Import recettes du monde
        run: node scripts/fetch-recipes.mjs
        continue-on-error: true

      - name: Build (export statique)
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
